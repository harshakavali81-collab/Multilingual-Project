# Limit login requests per direct client IP; configure upstream real-IP trust carefully
# when behind a load balancer, or apply rate limiting at the HTTPS ingress.
limit_req_zone $binary_remote_addr zone=login_gate:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /api/auth/login {
        limit_req zone=login_gate burst=5 nodelay;
        proxy_pass http://backend:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri /index.html;
    }
}
